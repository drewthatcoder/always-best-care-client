name: Android emulator QA

# Device UI evidence for the client app. Hosted Ubuntu runners provide KVM.
# This does not change app code. App.js returns before saving a push token
# when Device.isDevice is false, so an emulator run does not update profiles.push_token.

on:
  push:
    branches:
      - ci/android-emulator-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean
          df -h

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Hosted runners already have the SDK. setup-android@v3 still installs the
      # removed "tools" package and fails on cmdline-tools 16, so this job
      # calls sdkmanager directly and does not print the license text.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          if [[ ! -e "$SDK_ROOT/cmdline-tools/latest" && -d "$SDK_ROOT/cmdline-tools/16.0" ]]; then
            sudo ln -sfn "$SDK_ROOT/cmdline-tools/16.0" "$SDK_ROOT/cmdline-tools/latest"
          fi
          SM=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SM="$candidate"
              break
            fi
          done
          if [[ -z "$SM" ]]; then
            echo "sdkmanager was not found in the hosted Android SDK."
            exit 1
          fi
          sudo mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            | sudo tee "$SDK_ROOT/licenses/android-sdk-license" >/dev/null
          yes | "$SM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Embed the JS bundle in the debug APK
        run: |
          set -euo pipefail
          python3 .github/scripts/embed-debug-bundle.py
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' android/gradle.properties

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if ! unzip -l "$APK" | grep -q 'index\.android\.bundle'; then
            echo "JS bundle was not embedded in the debug APK."
            exit 1
          fi
          echo "Debug APK contains the embedded JS bundle."
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Detect QA client secrets
        id: qa
        env:
          QA_CLIENT_EMAIL: ${{ secrets.QA_CLIENT_EMAIL }}
          QA_CLIENT_PASSWORD: ${{ secrets.QA_CLIENT_PASSWORD }}
        run: |
          set +x
          if [ -n "$QA_CLIENT_EMAIL" ]; then
            echo "::add-mask::$QA_CLIENT_EMAIL"
          fi
          if [ -n "$QA_CLIENT_PASSWORD" ]; then
            echo "::add-mask::$QA_CLIENT_PASSWORD"
          fi
          if [ -n "$QA_CLIENT_EMAIL" ] && [ -n "$QA_CLIENT_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Signed-in QA flows will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "QA client secrets are not set. Signed-in flows will be skipped."
          fi

      - name: Boot emulator, install, and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_PRESENT: ${{ steps.qa.outputs.present }}
          QA_CLIENT_EMAIL: ${{ secrets.QA_CLIENT_EMAIL }}
          QA_CLIENT_PASSWORD: ${{ secrets.QA_CLIENT_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/drive-android.sh

      - name: Record emulator push-token limitation
        if: always()
        run: |
          mkdir -p maestro-artifacts
          cat > maestro-artifacts/NOTES.txt <<'EOF'
          App.js registerForPushNotifications returns immediately when Device.isDevice is false.
          This emulator is not a physical device, so profiles.push_token is not updated on these launches.
          Check (h) only shows that the UI still comes back after several opens. The profile-row database check is separate.
          Signed-in flows (login, transportation pop-up, unread notification, provider call button, booking, profile) run only when both QA_CLIENT_EMAIL and QA_CLIENT_PASSWORD are set.
          EOF
          cat maestro-artifacts/NOTES.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Keep screenshots only
        if: always()
        run: |
          set -euo pipefail
          mkdir -p maestro-artifacts
          find maestro-artifacts -type f ! -name '*.png' ! -name 'NOTES.txt' ! -name 'screenshot-list.txt' -delete
          find maestro-artifacts -type d -empty -delete || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: |
            maestro-artifacts/*.png
            maestro-artifacts/NOTES.txt
            maestro-artifacts/screenshot-list.txt
          retention-days: 3
          if-no-files-found: error
